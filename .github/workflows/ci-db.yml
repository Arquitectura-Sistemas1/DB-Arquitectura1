name: CI/CD - SQL Server Database Pipeline

on:
  push:
    branches:
      - develop
      - Develop
      - main
  pull_request:
    branches:
      - develop
      - Develop
      - main
  workflow_dispatch:

jobs:

  # JOB 1: Integración Continua (Pruebas en runner efímero)
  test-db:
    name: Integración Continua (test-db)
    runs-on: self-hosted

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Validar archivos requeridos del proyecto
        run: |
          set -e
          echo "Validando archivos requeridos..."
          for file in Dockerfile docker-compose.yml docker-entrypoint.sh .env.example README_DESPLIEGUE.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: No se encontró el archivo requerido '$file'."
              exit 1
            else
              echo "OK: '$file' encontrado."
            fi
          done

      - name: Levantar servicios con Docker Compose (Entorno de Prueba)
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          SQLSERVER_PORT: 1433
          LOAD_DEMO_DATA: false
        run: |
          echo "Compilando e iniciando el contenedor de SQL Server para pruebas..."
          docker compose up -d --build

      - name: Esperar a que SQL Server esté listo
        run: |
          set -e
          MAX_INTENTOS=30
          ESPERA=10
          INTENTO=1

          echo "Esperando inicialización del motor SQL Server..."

          while [ $INTENTO -le $MAX_INTENTOS ]; do
            echo "Intento $INTENTO de $MAX_INTENTOS..."

            if docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${{ secrets.MSSQL_SA_PASSWORD }}" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server está activo y aceptando conexiones."
              exit 0
            fi

            INTENTO=$((INTENTO + 1))
            sleep $ESPERA
          done

          echo "ERROR: Se agotaron los intentos. La base de datos no estuvo lista a tiempo."
          docker compose logs
          exit 1

      - name: Validar y ejecutar scripts SQL en el entorno de prueba
        run: |
          set -e
          SQL_FILES=$(find . -maxdepth 1 -type f -name "*.sql")

          if [ -z "$SQL_FILES" ]; then
            echo "No se encontraron scripts .sql en la raíz del proyecto. Se omite este paso."
            exit 0
          fi

          for SCRIPT in $SQL_FILES; do
            NOMBRE_SCRIPT=$(basename "$SCRIPT")
            echo "Ejecutando y probando script: $NOMBRE_SCRIPT..."

            docker compose cp "$SCRIPT" sqlserver:/tmp/"$NOMBRE_SCRIPT"

            docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "${{ secrets.MSSQL_SA_PASSWORD }}" -C \
              -i /tmp/"$NOMBRE_SCRIPT" -b

            echo "Script '$NOMBRE_SCRIPT' ejecutado correctamente sin errores sintácticos."
          done

      - name: Limpieza del entorno de pruebas
        if: always()
        run: |
          echo "Deteniendo y removiendo contenedores temporales de prueba..."
          docker compose down -v || true


  # JOB 2: Despliegue a Desarrollo
  deploy-dev:
    name: Despliegue a Desarrollo (deploy-dev)
    runs-on: self-hosted
    needs: test-db
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/Develop')

    steps:
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configurar clave SSH privada
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Configurar SSH config para túnel vía Tailscale
        run: |
          cat >> ~/.ssh/config <<EOF
          Host dev-server
            HostName ${{ secrets.DEV_SERVER_HOST }}
            User ${{ secrets.DEV_SERVER_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand tailscale nc %h %p
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Desplegar en servidor de Desarrollo vía SSH
        run: |
          ssh dev-server ENDSSH
            set -e
            cd /home/Brxckin/DB-Arquitectura1

            echo "Actualizando código desde la rama ${{ github.ref_name }}..."
            git pull origin ${{ github.ref_name }}

            echo "Reconstruyendo y reiniciando contenedor mediante Docker Compose..."
            docker compose up -d --build

            echo "Despliegue a Desarrollo completado exitosamente."
          ENDSSH


  # JOB 3: Despliegue a Producción
  deploy-prod:
    name: Despliegue a Producción (deploy-prod)
    runs-on: self-hosted
    needs: test-db
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Desplegar en servidor de Producción
        run: |
          set -e
          cd /home/Brxckin/DB-Arquitectura1

          echo "Actualizando código desde la rama main..."
          git pull origin main

          echo "Reconstruyendo y desplegando contenedores de Producción..."
          docker compose up -d --build

          echo "Despliegue a Producción completado exitosamente."
