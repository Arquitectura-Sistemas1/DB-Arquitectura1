name: CI/CD Pipeline - Base de datos

on:
  push:
    branches: [ "develop", "main", "Develop" ]
  pull_request:
    branches: [ "develop", "main", "Develop" ]

jobs:
  
  # 1. INTEGRACIÓN CONTINUA (CI) HECHO POR MARCOS GARCIA 

  test-db:
    runs-on: self-hosted

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar archivos obligatorios
        run: |
          test -f Dockerfile || (echo "ERROR: Falta Dockerfile" && exit 1)
          test -f .env.example || (echo "ERROR: Falta .env.example" && exit 1)
          test -f README.md || (echo "ERROR: Falta README.md" && exit 1)

      - name: Instalar cliente sqlcmd (Microsoft SQL Server Tools)
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y mssql-tools unixodbc-dev
          echo '/opt/mssql-tools/bin' >> $GITHUB_PATH

      - name: Probar ejecucion de scripts SQL
        run: |
          echo "Esperando que SQL Server termine de iniciar..."
          sleep 15
          
          # Recorre todos los scripts .sql en orden alfabetico/numerico
          for file in $(find . -name "*.sql" | sort); do
            echo "Ejecutando script: $file"
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "${{ secrets.DB_PASSWORD }}" -i "$file" -b
          done

      - name: Validar compilacion de Dockerfile
        run: docker build -t db-test .

  
  # 2. ESTOOOO ES DEL DESPLIEGUE CONTINUO - DESARROLLO (Ubuntu Server / Tailscale)
  
  deploy-dev:
    name: Despliegue a Entorno de Desarrollo
    needs: test-db
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/Develop')
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Conectar a la VPN de Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Desplegar SQL Server en Ubuntu Server vía SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            cd /ruta/de/tu/proyecto/db
            git pull origin Develop
            docker build -t db-dev .
            docker stop db-dev-container || true
            docker rm db-dev-container || true
            docker run -d --name db-dev-container -p 1433:1433 db-dev

  
  # 3. ESTOOOO ES DEL DESPLIEGUE CONTINUO - PRODUCCIÓN (Oracle Cloud)
  deploy-prod:
    name: Despliegue a Producción (OCI)
    needs: test-db
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Desplegar SQL Server en Oracle Cloud vía SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /ruta/de/tu/proyecto/db
            git pull origin main
            docker build -t db-prod .
            docker stop db-prod-container || true
            docker rm db-prod-container || true
            docker run -d --name db-prod-container -p 1433:1433 db-prod
